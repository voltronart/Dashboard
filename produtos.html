<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - Jogi Hortaliças</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/variaveis.css">
  <link rel="stylesheet" href="css/responsividade.css">


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="overlay-menu" id="overlay-menu"></div>


  <div class="app-layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-topo">
        <h2>Jogi Hortaliças</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="produtos.html" class="nav-link ativo">Produtos</a>
        <a href="pedidos.html" class="nav-link">Pedidos</a>
        <a href="financeiro.html" class="nav-link">Financeiro</a>
        <a href="produtos-avulso.html" class="nav-link">Produtos Avulso</a>
          <a href="cadastro-canteiros.html" class="nav-link">Canteiros</a>
        <a href="cadastro-cultivos.html" class="nav-link">Cultivos</a>

      </nav>
      <div class="sidebar-rodape">
        <button id="btn-logout" class="nav-link">Sair</button>
      </div>
    </aside>

    <main class="conteudo">
      <header class="conteudo-header">
                <button id="btn-menu" class="btn-menu" aria-label="Abrir menu">☰</button>

        <h1>Produtos</h1>
        <button id="btn-novo-produto" class="botao-primario">+ Novo produto</button>
      </header>

      <section class="conteudo-corpo">
        <table class="tabela-padrao">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Produto</th>
              <th>Unidade</th>
              <th>Preço</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos-body">
            <!-- linhas geradas via JS -->
          </tbody>
        </table>
      </section>
    </main>

  </div>

  <!-- Modal de cadastro/edição de produto -->
  <div id="modal-produto" class="modal-overlay escondido">
    <div class="modal-box">
      <h2>Novo produto</h2>
      <form id="form-produto">
        <input type="hidden" id="produto-id">

        <label for="produto-nome">Nome do produto</label>
        <input type="text" id="produto-nome" required>

        <label for="produto-descricao">Descrição</label>
        <textarea id="produto-descricao" rows="3" placeholder="Ex: Alface fresca colhida no dia"></textarea>

        <label for="produto-unidade">Unidade (kg, maço, caixa...)</label>
        <input type="text" id="produto-unidade" placeholder="kg">

        <label for="produto-preco">Preço</label>
        <input type="number" step="0.01" id="produto-preco" required>

        <label for="produto-imagem">Foto do produto</label>
        <input type="file" id="produto-imagem" accept="image/*">
        <img id="preview-imagem" src="" alt="" style="max-width:120px; margin-top:8px; display:none; border-radius:8px;">

        <label class="checkbox-linha">
          <input type="checkbox" id="produto-disponivel" checked>
          Disponível na loja
        </label>

        <div class="modal-acoes">
          <button type="button" id="btn-cancelar-produto" class="botao-secundario">Cancelar</button>
          <button type="submit" class="botao-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/supabaseConfig.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/produtos.js"></script>

 <script>
  const btnMenu = document.getElementById('btn-menu');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay-menu');

  function abrirMenu() {
    sidebar.classList.add('aberta');
    overlay.classList.add('visivel');
  }

  function fecharMenu() {
    sidebar.classList.remove('aberta');
    overlay.classList.remove('visivel');
  }

  if (btnMenu && sidebar && overlay) {
    btnMenu.addEventListener('click', () => {
      const aberto = sidebar.classList.contains('aberta');
      aberto ? fecharMenu() : abrirMenu();
    });

    overlay.addEventListener('click', fecharMenu);

    document.querySelectorAll('.sidebar a, .sidebar button').forEach((item) => {
      item.addEventListener('click', () => {
        if (window.innerWidth <= 768) fecharMenu();
      });
    });
  }
</script>
</body>
</html>
