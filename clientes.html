<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Jogi Hortaliças</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/variaveis.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsividade.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="overlay-menu" id="overlay-menu"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-topo">
        <h2>Jogi Hortaliças</h2>
      </div>

      <nav class="sidebar-nav">
        <a href="clientes.html" class="nav-link ativo">Clientes</a>
        <a href="produtos.html" class="nav-link">Produtos</a>
        <a href="pedidos.html" class="nav-link">Pedidos</a>
        <a href="financeiro.html" class="nav-link">Financeiro</a>
      </nav>

      <div class="sidebar-rodape">
        <button id="btn-logout" class="nav-link">Sair</button>
      </div>
    </aside>

    <main class="conteudo">
      <header class="conteudo-header">
        <button id="btn-menu" class="btn-menu" aria-label="Abrir menu">☰</button>
        <h1>Clientes</h1>
        <button id="btn-novo-cliente" class="botao-primario">+ Novo cliente</button>
      </header>

      <section class="conteudo-corpo">
        <table class="tabela-padrao">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Contato</th>
              <th>Status</th>
              <th>Link da loja</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-clientes-body">
            <!-- linhas geradas via JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="modal-cliente" class="modal-overlay escondido">
    <div class="modal-box">
      <h2>Novo cliente</h2>
      <form id="form-cliente">
        <input type="hidden" id="cliente-id">

        <label for="cliente-nome">Nome do restaurante</label>
        <input type="text" id="cliente-nome" required>

        <label for="cliente-slug">Slug (identificador da URL)</label>
        <input type="text" id="cliente-slug" placeholder="ex: mc, bk, subway" required>

        <label for="cliente-contato">Contato (WhatsApp)</label>
        <input type="text" id="cliente-contato" placeholder="5561999999999">

        <label for="cliente-responsavel">Responsável</label>
        <input type="text" id="cliente-responsavel" placeholder="Ex: João (Compras)">

        <label for="cliente-pagamento">Condição de pagamento</label>
        <input type="text" id="cliente-pagamento" placeholder="Ex: 30 dias, à vista">

        <label for="cliente-pedido-minimo">Pedido mínimo</label>
        <input type="number" id="cliente-pedido-minimo" step="0.01" placeholder="0.00">

        <div class="modal-acoes">
          <button type="button" id="btn-cancelar-cliente" class="botao-secundario">Cancelar</button>
          <button type="submit" class="botao-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/supabaseConfig.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>

  <script>
  const btnMenu = document.getElementById('btn-menu');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay-menu');

  function abrirMenu() {
    sidebar.classList.add('aberta');
    overlay.classList.add('visivel');
  }

  function fecharMenu() {
    sidebar.classList.remove('aberta');
    overlay.classList.remove('visivel');
  }

  if (btnMenu && sidebar && overlay) {
    btnMenu.addEventListener('click', () => {
      const aberto = sidebar.classList.contains('aberta');
      aberto ? fecharMenu() : abrirMenu();
    });

    overlay.addEventListener('click', fecharMenu);

    document.querySelectorAll('.sidebar a, .sidebar button').forEach((item) => {
      item.addEventListener('click', () => {
        if (window.innerWidth <= 768) fecharMenu();
      });
    });
  }
</script>
</body>
</html>
