<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogi Hortaliças - Login</title>
  <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/variaveis.css">
    <link rel="stylesheet" href="css/responsividade.css">


</head>
<body class="pagina-login">

  <main class="login-container">
    <form id="form-login" class="login-box">
      <h1>Jogi Hortaliças</h1>
      <p class="subtitulo">Painel Administrativo</p>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="••••••••" required>

      <button type="submit">Entrar</button>

      <p id="erro-login" class="mensagem-erro"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/utils.js"></script>
<script src="js/supabaseConfig.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
